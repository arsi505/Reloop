<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Reloop</title>
  <style>
    .route { stroke-dasharray: 72; stroke-dashoffset: 72; animation: draw 900ms cubic-bezier(.65,0,.35,1) forwards; }
    .route-b { animation-delay: 130ms; }
    .signal { opacity: 0; transform-box: fill-box; transform-origin: center; animation: arrive 360ms ease-out forwards; }
    .signal-b { animation-delay: 180ms; }
    .verified { animation-delay: 850ms; }
    .check { stroke-dasharray: 10; stroke-dashoffset: 10; animation: check 320ms ease-out 1080ms forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes arrive { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: scale(1); } }
    @keyframes check { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .route, .signal, .check { animation: none; opacity: 1; stroke-dashoffset: 0; } }
  </style>
  <path class="route" d="M10 18H21C29.5 18 29.5 32 38 32H54" stroke="#171814" stroke-width="8" stroke-linecap="round"/>
  <path class="route route-b" d="M10 46H21C29.5 46 29.5 32 38 32" stroke="#171814" stroke-width="8" stroke-linecap="round"/>
  <circle class="signal" cx="10" cy="18" r="4" fill="#FF5C35"/>
  <circle class="signal signal-b" cx="10" cy="46" r="4" fill="#FF5C35"/>
  <circle class="signal verified" cx="54" cy="32" r="7" fill="#FF5C35"/>
  <path class="check" d="M50.8 32.1L53.1 34.3L57.2 29.5" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
