services:
  postgres:
    image: postgres:16-alpine
    container_name: reloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reloop_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-reloop}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - reloop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reloop} -d ${POSTGRES_DB:-reloop}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reloop-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - reloop_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  reloop_postgres_data:
  reloop_redis_data:
